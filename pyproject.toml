[project]
name = "py-pacman"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "autopep8 (==2.3.2)",
    "flake8 (==7.3.0)",
    "mccabe (==0.7.0)",
    "mypy (==1.17.0)",
    "mypy-extensions (==1.1.0)",
    "pathspec (==0.12.1)",
    "py-libs",
    "pycodestyle (==2.14.0)",
    "pyflakes (==3.4.0)",
    "pyfzf>=0.3.1",
    "rich>=14.1.0",
